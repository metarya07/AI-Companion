<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniRoute & Claude Code Manager - JARVIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 15, 20, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white custom-scrollbar">

  <!-- Top Navigation / Status Header -->
  <header class="border-b border-zinc-800/80 bg-zinc-900/60 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Brand & Icon -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-lg">
          <i class="fa-solid fa-route"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            JARVIS <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">OmniRoute & Agent Manager</span>
          </h1>
          <p class="text-xs text-zinc-400">AI-Companion Multi-Model Gateway & Coding Agent Suite</p>
        </div>
      </div>

      <!-- Live Server Status Indicator & Controls -->
      <div class="flex items-center gap-3">
        <!-- Status Pill -->
        <div id="status-pill" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-medium bg-zinc-800/80 border-zinc-700 text-zinc-300">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="status-text">Checking OmniRoute...</span>
        </div>

        <!-- Start OmniRoute button -->
        <button id="btn-start-omniroute" onclick="startOmniRoute()" class="hidden text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded-lg transition-all shadow-md shadow-emerald-900/20 flex items-center gap-1.5">
          <i class="fa-solid fa-play text-[10px]"></i> Start Server
        </button>

        <!-- Open Dashboard Button -->
        <a href="http://localhost:20128" target="_blank" class="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-sliders text-indigo-400"></i> Gateway UI
        </a>

        <!-- Sync Profiles Button -->
        <button onclick="syncProfiles()" id="btn-sync" title="Sync newly configured models" class="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
          <i id="sync-icon" class="fa-solid fa-rotate text-violet-400"></i> Sync Models
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

    <!-- Workspace Project Selection Box -->
    <div class="glass-card rounded-2xl p-5 shadow-2xl relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-regular fa-folder-open text-indigo-400 text-sm"></i>
            <span class="text-xs uppercase tracking-wider font-semibold text-zinc-400">Target Working Directory</span>
          </div>
          <div class="flex items-center gap-2">
            <select id="project-select" class="bg-zinc-900/90 border border-zinc-700/80 rounded-xl px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 flex-1 font-mono">
              <option value="A:\Projects\AI-Companion">AI-Companion (A:\Projects\AI-Companion)</option>
            </select>
          </div>
        </div>

        <!-- Quick 1-Click Launch Hero Button -->
        <div class="flex items-center gap-3 w-full md:w-auto">
          <button onclick="launchWithProfile('auto-best-free')" class="w-full md:w-auto bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2 text-sm group">
            <i class="fa-solid fa-bolt text-amber-300 group-hover:scale-110 transition-transform"></i>
            <span>Quick Launch (Free Best Auto)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      
      <!-- Search Input -->
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
        <input type="text" id="search-input" oninput="filterProfiles()" placeholder="Search from 330+ Claude Code profiles (e.g. free, opus, gemma, deepseek, nvidia)..." class="w-full bg-zinc-900/80 border border-zinc-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
      </div>

      <!-- Categories Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 custom-scrollbar text-xs" id="category-pills">
        <button onclick="setCategory('all')" class="category-btn active px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm">All</button>
        <button onclick="setCategory('Recommended & Combo')" class="category-btn px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200">⭐ Combos & Free</button>
        <button onclick="setCategory('Antigravity / Gemini')" class="category-btn px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200">Google & Antigravity</button>
        <button onclick="setCategory('Nvidia NIM')" class="category-btn px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200">Nvidia NIM</button>
        <button onclick="setCategory('OpenRouter')" class="category-btn px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200">OpenRouter</button>
        <button onclick="setCategory('Kiro Code')" class="category-btn px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200">Kiro</button>
      </div>

    </div>

    <!-- Profiles Grid -->
    <div id="profiles-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
      <!-- Loading Skeleton -->
      <div class="glass-card rounded-xl p-4 animate-pulse flex flex-col gap-2">
        <div class="h-4 bg-zinc-800 rounded w-1/3"></div>
        <div class="h-5 bg-zinc-800 rounded w-3/4"></div>
      </div>
      <div class="glass-card rounded-xl p-4 animate-pulse flex flex-col gap-2">
        <div class="h-4 bg-zinc-800 rounded w-1/3"></div>
        <div class="h-5 bg-zinc-800 rounded w-3/4"></div>
      </div>
      <div class="glass-card rounded-xl p-4 animate-pulse flex flex-col gap-2">
        <div class="h-4 bg-zinc-800 rounded w-1/3"></div>
        <div class="h-5 bg-zinc-800 rounded w-3/4"></div>
      </div>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium border bg-zinc-900 border-zinc-700 text-white">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-message">Message</span>
  </div>

  <script>
    let allProfiles = [];
    let currentCategory = 'all';

    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        const pill = document.getElementById('status-pill');
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        const startBtn = document.getElementById('btn-start-omniroute');

        if (data.omnirouteRunning) {
          pill.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-medium bg-emerald-950/40 border-emerald-500/30 text-emerald-300';
          dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]';
          text.innerText = `OmniRoute Online (:20128) · ${data.profilesCount} Profiles`;
          startBtn.classList.add('hidden');
        } else {
          pill.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-medium bg-rose-950/40 border-rose-500/30 text-rose-300';
          dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
          text.innerText = 'OmniRoute Offline';
          startBtn.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Status check error:', err);
      }
    }

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        const select = document.getElementById('project-select');
        select.innerHTML = '';
        projects.forEach((p, idx) => {
          const opt = document.createElement('option');
          opt.value = p.path;
          opt.innerText = p.name ? `${p.name} (${p.path})` : p.path;
          if (idx === 0) opt.selected = true;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function loadProfiles() {
      try {
        const res = await fetch('/api/profiles');
        allProfiles = await res.json();
        renderProfiles();
      } catch (err) {
        console.error(err);
      }
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = 'category-btn px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200';
      });
      event.target.className = 'category-btn active px-3 py-2 rounded-lg font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm';
      renderProfiles();
    }

    function filterProfiles() {
      renderProfiles();
    }

    function renderProfiles() {
      const container = document.getElementById('profiles-container');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allProfiles.filter(p => {
        const matchesCat = currentCategory === 'all' || p.category === currentCategory;
        const matchesQuery = !query || p.name.toLowerCase().includes(query) || p.badge.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-zinc-500">
            <i class="fa-solid fa-ghost text-3xl mb-2 text-zinc-600"></i>
            <p>No matching Claude Code profiles found.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(p => {
        let badgeColor = 'bg-zinc-800 text-zinc-400 border-zinc-700';
        if (p.badge.includes('Free')) badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        else if (p.badge.includes('Smart') || p.badge.includes('Auto')) badgeColor = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
        else if (p.badge.includes('Google') || p.badge.includes('Antigravity')) badgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
        else if (p.badge.includes('Nvidia')) badgeColor = 'bg-lime-500/10 text-lime-400 border-lime-500/20';

        return `
          <div class="glass-card rounded-xl p-4 flex flex-col justify-between gap-3 transition-all hover:-translate-y-0.5 group">
            <div>
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="text-[11px] font-medium px-2 py-0.5 rounded-md border ${badgeColor}">
                  ${p.badge}
                </span>
                ${p.isFree ? '<span class="text-[10px] uppercase font-bold tracking-wider text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-700/50">FREE</span>' : ''}
              </div>
              <h3 class="font-mono text-sm font-semibold text-zinc-200 truncate group-hover:text-indigo-300 transition-colors" title="${p.name}">
                ${p.name}
              </h3>
              <p class="text-xs text-zinc-500 truncate mt-0.5">${p.category}</p>
            </div>

            <button onclick="launchWithProfile('${p.name}')" class="w-full bg-zinc-800/80 hover:bg-indigo-600 text-zinc-200 hover:text-white font-medium text-xs py-2 px-3 rounded-lg border border-zinc-700 hover:border-indigo-500 transition-all flex items-center justify-center gap-2 group-hover:shadow-md">
              <i class="fa-solid fa-terminal text-[11px] text-zinc-400 group-hover:text-white"></i>
              <span>Launch in Terminal</span>
            </button>
          </div>
        `;
      }).join('');
    }

    async function launchWithProfile(profileName) {
      const select = document.getElementById('project-select');
      const projectPath = select.value;

      showToast(`Launching Claude Code [${profileName}] in ${projectPath}...`, 'info');

      try {
        const res = await fetch('/api/launch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile: profileName, project: projectPath })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Claude Code terminal launched successfully!`, 'success');
        } else {
          showToast(`Launch error: ${data.error}`, 'error');
        }
      } catch (err) {
        showToast(`Failed to launch: ${err.message}`, 'error');
      }
    }

    async function startOmniRoute() {
      showToast('Starting OmniRoute server...', 'info');
      try {
        await fetch('/api/start-omniroute', { method: 'POST' });
        setTimeout(checkStatus, 3000);
      } catch (err) {
        showToast('Error starting OmniRoute', 'error');
      }
    }

    async function syncProfiles() {
      const icon = document.getElementById('sync-icon');
      icon.classList.add('fa-spin');
      showToast('Syncing models from OmniRoute...', 'info');
      try {
        const res = await fetch('/api/sync-profiles', { method: 'POST' });
        const data = await res.json();
        icon.classList.remove('fa-spin');
        if (data.success) {
          showToast('Profiles updated successfully!', 'success');
          loadProfiles();
        } else {
          showToast('Sync failed: ' + data.error, 'error');
        }
      } catch (err) {
        icon.classList.remove('fa-spin');
        showToast('Sync error: ' + err.message, 'error');
      }
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-message');
      const icon = document.getElementById('toast-icon');

      text.innerText = msg;
      if (type === 'error') {
        icon.className = 'fa-solid fa-circle-exclamation text-rose-400';
      } else if (type === 'info') {
        icon.className = 'fa-solid fa-circle-info text-indigo-400';
      } else {
        icon.className = 'fa-solid fa-circle-check text-emerald-400';
      }

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3500);
    }

    // Polling & Startup
    checkStatus();
    loadProjects();
    loadProfiles();
    setInterval(checkStatus, 4000);
  </script>
</body>
</html>
