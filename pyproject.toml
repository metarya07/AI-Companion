[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-companion"
version = "0.9.0"
description = "A small, cross-platform local AI desktop assistant (CLI)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
vision = ["mss>=9.0", "Pillow>=10.0", "pytesseract>=0.3.10"]
dev = ["pytest>=7.0"]

[project.scripts]
jarvis = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["config", "core", "memory", "skills", "voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
